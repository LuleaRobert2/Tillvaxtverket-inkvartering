name: Daily Tillvaxtverket guest nights

on:
  workflow_dispatch:
  schedule:
    # 07:17 UTC = 08:17 CET / 09:17 CEST.
    # Daily checks are lightweight because the API query is server-side filtered
    # to Lulea municipality and years >= 2010.
    - cron: "17 7 * * *"

permissions:
  contents: write

concurrency:
  group: tillvaxtverket-inkvartering
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Tillvaxtverket data
        env:
          START_YEAR: "2010"
          MUNICIPALITY: "Luleå"
          LEVEL_NAME: "Kommun"
          REQUIRE_START_YEAR: "1"
        run: python scrape_tillvaxtverket.py

      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.csv data/latest.csv data/revisions.csv

          if git diff --cached --quiet; then
            echo "No data changes. Nothing to commit."
            exit 0
          fi

          git commit -m "Update Tillvaxtverket guest nights data"

          # Usually there is no concurrent writer, but rebase once before push
          # so a manual edit made during the run does not get overwritten.
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
